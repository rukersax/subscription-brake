name: subscription_brake
description: "Subscription Brake - 100% Offline, Privacy-First Subscription & Budget Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Offline Push Notifications ($0 Server Costs)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Direct 1-Tap Cancellation URLs
  url_launcher: ^6.3.0

  # Secure Storage & Export / Share
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.0.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

