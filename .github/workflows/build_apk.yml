name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        # EĞER pubspec.yaml 'frontend' KLASÖRÜNDEYSE ALTTAKİ SATIRIN BAŞINDAKİ '#' İŞARETİNİ KALDIRIN:
        # working-directory: ./frontend
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subscription-brake-apk
          # EĞER pubspec.yaml 'frontend' KLASÖRÜNDEYSE ALTTAKİ YOLUN BAŞINA 'frontend/' EKLEYİN:
          path: build/app/outputs/flutter-apk/app-release.apk
